<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container dark-gray-back">
        <div class="wrapper">
            <header>
                <div class="header-left">
                    <img src="./img/header/logo.svg" alt="">
                    <span class="header-title light-gray-2">
                        Сантехника для всех
                    </span>
                </div>
                <div class="header-right">
                    <img src="./img/header/iphone(1).svg" alt="">
                    <span class="header-phone light-gray-1 ">
                        +7 (905) 543 23 45
                    </span>
                    <img class="header-search" src="./img/header/search 1.svg" alt="">
                </div>
            </header>
        </div>
        <main class="description wrapper">
            <div class="description-left">
                <div class="description-title">
                    Сантехника и&nbsp;мебель для ванной комнаты
                </div>
                <div class="description-menu">
                    <div class="description-menu-item">
                        <div class="description-menu-content description-company">
                            <img src="./img/main/Vector.svg" alt="">
                            <span class="light-gray-3">
                                О компании
                            </span>
                            <div class="description-menu-line"></div>
                        </div>
                        <div class="description-menu-content description-products">
                            <img src="./img/main/Vector.svg" alt="">
                            <span class="light-gray-3">
                                О продукции
                            </span>
                            <div class="description-menu-line"></div>
                        </div>
                        <div class="description-menu-content description-goods">
                            <img src="./img/main/Vector.svg" alt="">
                            <span class="light-gray-3">
                                Каталог товаров
                            </span>
                            <div class="description-menu-line"></div>
                        </div>
                    </div>
                </div>
                <div class="description-menu-footer">
                    <div class="description-menu-footer-item gray-back ">

                    </div>
                    <div class="description-menu-footer-item gray-back ">

                    </div>
                    <div class="description-menu-footer-item gray-back ">

                    </div>
                </div>
            </div>
            <div class="description-right">
                <div class="description-price">
                    от 4 990 ₽
                </div>
                <img src="./img/main/tap1.png" alt="" class="description-tap">
            </div>
        </main>
    </div>
    <div class="container light-gray-back">
        <div class="wrapper">
            
        </div>
    </div>
</body>
</html>
